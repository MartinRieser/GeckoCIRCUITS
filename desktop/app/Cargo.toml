[package]
name = "gecko-desktop"
version = "1.0.0"
edition = "2021"
description = "GeckoCIRCUITS desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gecko-engine = { path = "../engine" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
