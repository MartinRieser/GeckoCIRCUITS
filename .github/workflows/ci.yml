name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        # the uploaded artifact is the shaded fat jar from `mvn package`;
        # `assembly:single` needs a dist-* profile and would fail bare
        run: mvn clean install -DskipTests --no-transfer-progress

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb build-essential

      - name: Build native test libraries
        run: |
          cd src/modules/gecko-gui/src/test/java/gecko/geckocircuits/nativec/testJNI_DLL
          chmod +x build_native_libraries.sh
          ./build_native_libraries.sh

      - name: Run engine & REST API tests (gating)
        run: |
          mvn test --no-transfer-progress -pl src/modules/gecko-simulation-core,src/modules/gecko-rest-api -am

      - name: Run GUI tests with coverage (non-gating, needs display)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 1
          mvn test --no-transfer-progress -pl src/modules/gecko-gui -Dmaven.test.failure.ignore=true
          mvn org.jacoco:jacoco-maven-plugin:report --no-transfer-progress

      - name: Check GUI test results
        run: |
          if grep -rq "Failures: [1-9]" src/modules/gecko-gui/target/surefire-reports/*.txt 2>/dev/null; then
            echo "::warning::GUI test failures detected"
            grep "Failures: [1-9]" src/modules/gecko-gui/target/surefire-reports/*.txt
          fi
          if grep -rq "Errors: [1-9]" src/modules/gecko-gui/target/surefire-reports/*.txt 2>/dev/null; then
            echo "::warning::GUI test errors detected (expected in CI for GUI/native tests)"
            grep "Errors: [1-9]" src/modules/gecko-gui/target/surefire-reports/*.txt
          fi
          echo "Build and test step completed"

      - name: Coverage summary
        run: |
          if [ -f src/modules/gecko-gui/target/site/jacoco/index.html ]; then
            echo "## JaCoCo Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Instruction Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|---------------------|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import html.parser
          class P(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_td=False; self.in_a=False; self.rows=[]; self.cur=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='td': self.in_td=True
                  if tag=='a' and self.in_td: self.in_a=True
              def handle_endtag(self,tag):
                  if tag=='td': self.in_td=False
                  if tag=='a': self.in_a=False
                  if tag=='tr' and self.cur: self.rows.append(self.cur[:]); self.cur=[]
              def handle_data(self,data):
                  if self.in_td or self.in_a: self.cur.append(data.strip())
          with open('src/modules/gecko-gui/target/site/jacoco/index.html') as f: content=f.read()
          p=P(); p.feed(content)
          core=['control.calculators','datacontainer','math','circuit.matrix','circuit.netlist','circuit.simulation','circuit.component','circuit.terminal','modelviewcontrol']
          for row in p.rows:
              if len(row)>=3:
                  name=row[0]
                  short=name.replace('gecko.geckocircuits.','').replace('gecko.','')
                  if any(c in short for c in core):
                      cov=row[2] if '%' in row[2] else row[1] if len(row)>1 and '%' in row[1] else '?'
                      print(f'| {short} | {cov} |')
          " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full report available in the coverage artifact." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate example circuits
        continue-on-error: true
        run: |
          export DISPLAY=:99
          python3 scripts/run-examples.py

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GeckoCIRCUITS-jar
          path: src/modules/gecko-gui/target/gecko-1.0-jar-with-dependencies.jar
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: src/modules/gecko-gui/target/site/jacoco/
          retention-days: 30

