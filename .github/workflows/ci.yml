name: CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build
        # the uploaded artifact is the shaded fat jar from `mvn package`;
        # `assembly:single` needs a dist-* profile and would fail bare
        run: mvn clean install -DskipTests --no-transfer-progress

      - name: Run engine, MCP & REST API tests (gating)
        run: |
          mvn verify --no-transfer-progress -pl backend/gecko-simulation-core,backend/gecko-mcp,backend/gecko-rest-api -am

      - name: Upload REST API Engine JAR
        uses: actions/upload-artifact@v7
        with:
          name: gecko-rest-api-jar
          path: backend/gecko-rest-api/target/gecko-rest-api-*.jar
          retention-days: 30
          if-no-files-found: warn

      - name: Upload MCP Server JAR
        uses: actions/upload-artifact@v7
        with:
          name: gecko-mcp-jar
          path: backend/gecko-mcp/target/gecko-mcp-*.jar
          retention-days: 30
          if-no-files-found: warn

