name: Desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'frontend/**'
      - 'src/modules/gecko-rest-api/**'
      - 'scripts/desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Publish a GitHub release from the built installers'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # PR quality gate: Rust on the official Tauri toolchain (MSVC),
  # Java + frontend on Linux.
  # ------------------------------------------------------------------
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Format
        working-directory: desktop
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace -- -D warnings

      - name: Unit tests
        working-directory: desktop
        run: cargo test -p gecko-engine

      - name: Compile check (full tauri_build on MSVC)
        working-directory: desktop
        run: cargo check -p gecko-desktop

  java-frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Java tests (engine + REST API)
        run: mvn test --no-transfer-progress -pl src/modules/gecko-simulation-core,src/modules/gecko-rest-api -am

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend tests
        run: npm --prefix frontend test

  # ------------------------------------------------------------------
  # Installer build: 3-OS matrix on tags or manual dispatch.
  # ------------------------------------------------------------------
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [rust-check, java-frontend-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install Linux build dependencies
        if: matrix.artifact == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libfuse2

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/desktop/set-version.py "${{ github.ref_name }}"

      - name: Build engine bundle
        run: python3 scripts/desktop/build-engine.py

      - name: Build installers
        working-directory: desktop/app
        run: cargo tauri build

      - name: Upload artifacts (windows)
        if: matrix.artifact == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: GeckoCIRCUITS-desktop-windows
          path: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/msi/*.msi

      - name: Upload artifacts (macos)
        if: matrix.artifact == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: GeckoCIRCUITS-desktop-macos
          path: desktop/target/release/bundle/dmg/*.dmg

      - name: Upload artifacts (linux)
        if: matrix.artifact == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: GeckoCIRCUITS-desktop-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage

  # ------------------------------------------------------------------
  # Release: collect installers, checksums, publish on tag/dispatch.
  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
