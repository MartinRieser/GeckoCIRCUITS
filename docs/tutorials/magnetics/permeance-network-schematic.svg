<text x="450" y="263" class="label">P_gap</text>
<line x1="450" y1="130" x2="450" y2="160" class="wire" />
<line x1="450" y1="205" x2="450" y2="235" class="wire" />
<line x1="450" y1="280" x2="450" y2="310" class="wire" />
<circle cx="450" cy="130" r="4" class="junction" />
<circle cx="450" cy="310" r="4" class="junction" />
<rect x="580" y="195" width="50" height="50" class="comp-body" />
<text x="605" y="225" class="label">P_&#963;2</text>
<line x1="605" y1="130" x2="605" y2="195" class="wire" />
<line x1="605" y1="245" x2="605" y2="310" class="wire" />
<circle cx="605" cy="130" r="4" class="junction" />
<circle cx="605" cy="310" r="4" class="junction" />
<circle cx="700" cy="220" r="22" class="comp-body" />
<text x="700" y="215" class="label">F_2</text>
<text x="700" y="235" class="sublabel">N_2 &#183; i_2</text>
<line x1="700" y1="198" x2="700" y2="130" class="wire" />
<line x1="700" y1="242" x2="700" y2="310" class="wire" />
<circle cx="700" cy="130" r="4" class="junction" />
<circle cx="700" cy="310" r="4" class="junction" />
</svg>