    <text x="280" y="174" class="sublabel">Leakage Ind.</text>
    
<circle cx="360" cy="150" r="4" class="junction" />
<line x1="360" y1="150" x2="360" y2="180" class="wire" />
<line x1="330" y1="180" x2="390" y2="180" class="wire" />

