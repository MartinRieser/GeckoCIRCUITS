<path d="M 490 150 C 470 150, 470 180, 490 180 C 470 180, 470 210, 490 210 C 470 210, 470 240, 490 240 C 470 240, 470 270, 490 270 C 470 270, 470 300, 490 300" class="wire" />
<circle cx="438" cy="160" r="3.5" fill="#0f172a" />
<circle cx="502" cy="160" r="3.5" fill="#0f172a" />
