             C 564 134, 578 134, 578 150" class="wire" stroke-width="2.5" />
    <line x1="578" y1="150" x2="610" y2="150" class="wire" />
    <text x="550" y="128" class="label">L_&#963;s</text>
    <text x="550" y="174" class="sublabel">Sec. Leakage</text>
    

    <line x1="610" y1="150" x2="642" y2="150" class="wire" />
    <rect x="642" y="138" width="56" height="24" class="comp-body" />
    <line x1="698" y1="150" x2="730" y2="150" class="wire" />
