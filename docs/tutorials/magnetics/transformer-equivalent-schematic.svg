<path d="M 450 150 C 470 150, 470 180, 450 180 C 470 180, 470 210, 450 210 C 470 210, 470 240, 450 240 C 470 240, 470 270, 450 270 C 470 270, 470 300, 450 300" class="wire" />
<line x1="468" y1="140" x2="468" y2="310" class="wire-thin" stroke-width="2" />
<line x1="472" y1="140" x2="472" y2="310" class="wire-thin" stroke-width="2" />
<path d="M 490 150 C 470 150, 470 180, 490 180 C 470 180, 470 210, 490 210 C 470 210, 470 240, 490 240 C 470 240, 470 270, 490 270 C 470 270, 470 300, 490 300" class="wire" />
<circle cx="438" cy="160" r="3.5" fill="#0f172a" />
<circle cx="502" cy="160" r="3.5" fill="#0f172a" />
<text x="470" y="335" class="label">N_1 : N_2</text>
<line x1="490" y1="150" x2="540" y2="150" class="wire" />

    <line x1="540" y1="150" x2="555" y2="150" class="wire" />
    <path d="M 555 150 C 555 132, 570 132, 570 150
             C 570 132, 585 132, 585 150
             C 585 132, 600 132, 600 150
             C 600 132, 615 132, 615 150" class="wire" stroke-width="2.5" />
    <line x1="615" y1="150" x2="630" y2="150" class="wire" />
    <text x="585" y="126" class="label">L_{&#963;s}</text>
    <text x="585" y="174" class="sublabel">Sec. Leakage</text>
    

    <line x1="645" y1="150" x2="660" y2="150" class="wire" />
    <rect x="660" y="138" width="60" height="24" class="comp-body" />
    <line x1="720" y1="150" x2="735" y2="150" class="wire" />
    <text x="690" y="132" class="label">R_s</text>
    <text x="690" y="176" class="sublabel">Sec. Winding</text>
    
<line x1="735" y1="150" x2="780" y2="150" class="wire" />
<line x1="490" y1="300" x2="780" y2="300" class="wire" />
<circle cx="780" cy="150" r="4" fill="#0284c7" />
<circle cx="780" cy="300" r="4" fill="#0284c7" />

    <circle cx="790" cy="150" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <circle cx="790" cy="300" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <text x="804" y="155" class="tag-pos">+</text>
    <text x="804" y="305" class="tag-neg">&#8722;</text>
    <line x1="815" y1="165" x2="815" y2="285" class="measure-arrow" marker-end="url(#arr-blue)" />
