<text x="270" y="245" class="sublabel">Rectifier</text>
<line x1="230" y1="205" x2="210" y2="205" class="wire" />
<line x1="210" y1="150" x2="210" y2="205" class="wire" />
<circle cx="210" cy="150" r="4" class="junction" />
<line x1="230" y1="255" x2="210" y2="255" class="wire" />
<line x1="210" y1="310" x2="210" y2="255" class="wire" />
