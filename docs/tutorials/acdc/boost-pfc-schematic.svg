    <line x1="630" y1="236" x2="630" y2="275" class="wire" />
    <text x="656" y="227" class="label-start">C_out</text>
    <text x="656" y="245" class="sublabel-start">Bulk 400V</text>
    

    <line x1="710" y1="185" x2="710" y2="200" class="wire" />
    <rect x="698" y="200" width="24" height="60" class="comp-body" />
