    <text x="730" y="245" class="sublabel-start">Load</text>
    

    <circle cx="760" cy="150" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <circle cx="760" cy="310" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <text x="774" y="155" class="tag-pos">+</text>
