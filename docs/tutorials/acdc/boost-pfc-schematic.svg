    <text x="462" y="246" class="sublabel" text-anchor="end">MOSFET / IGBT</text>
    

    <line x1="525" y1="150" x2="546" y2="150" class="wire" />
    <polygon points="546,134 574,150 546,166" class="comp-diode" />
    <line x1="574" y1="134" x2="574" y2="166" class="wire" stroke-width="2.5" stroke="#0284c7" />
    <line x1="574" y1="150" x2="595" y2="150" class="wire" />
