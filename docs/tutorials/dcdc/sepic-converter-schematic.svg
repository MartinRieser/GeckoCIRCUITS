<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-thin { stroke: #64748b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-dashed { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
      .wire-gnd { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; }
      .junction { fill: #1e293b; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #0f172a; font-weight: 600; text-anchor: middle; }
      .label-start { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #0f172a; font-weight: 600; text-anchor: start; }
      .label-end { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #0f172a; font-weight: 600; text-anchor: end; }
      .sublabel { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; text-anchor: middle; }
      .sublabel-start { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; text-anchor: start; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 16px; fill: #0f172a; font-weight: 700; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #64748b; font-weight: 400; }
      .comp-body { fill: #ffffff; stroke: #1e293b; stroke-width: 2.2; }
      .comp-diode { fill: #0284c7; stroke: #0284c7; stroke-width: 2; }
      .comp-sw { stroke: #0284c7; stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .arrow { fill: #0284c7; stroke: none; }
      .measure-arrow { stroke: #0284c7; stroke-width: 1.75; fill: none; }
      .tag-pos { fill: #dc2626; font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .tag-neg { fill: #2563eb; font-family: sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8px; }
      .block { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
      .block-accent { fill: #f0f9ff; stroke: #0284c7; stroke-width: 1.5; rx: 6px; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" class="card" />
  <text x="35" y="38" class="title">SEPIC Converter (Step-Up / Step-Down)</text>
  <text x="35" y="58" class="subtitle">European IEC 60617 Standard Schematic • Non-Inverting DC-DC Topology</text>
  
    <line x1="120" y1="140" x2="120" y2="193" class="wire" />
    <circle cx="120" cy="215" r="22" class="comp-body" />
    <line x1="120" y1="237" x2="120" y2="290" class="wire" />
    <text x="120" y="209" class="tag-pos">+</text>
    <text x="120" y="229" class="tag-neg">&#8722;</text>
    <text x="88" y="211" class="label-end">V_in</text>
    <text x="88" y="229" class="sublabel" text-anchor="end">DC Input</text>
    
<circle cx="120" cy="140" r="4" class="junction" />
<circle cx="120" cy="290" r="4" class="junction" />

    <line x1="120" y1="140" x2="157" y2="140" class="wire" />
    <path d="M 157 140 C 157 124, 171 124, 171 140
             C 171 124, 185 124, 185 140
             C 185 124, 199 124, 199 140
             C 199 124, 213 124, 213 140" class="wire" stroke-width="2.5" />
    <line x1="213" y1="140" x2="250" y2="140" class="wire" />
    <text x="185" y="118" class="label">L_1</text>
    <text x="185" y="164" class="sublabel">Input Inductor</text>
    
<circle cx="250" cy="140" r="4" class="junction" />

    <line x1="250" y1="140" x2="250" y2="197" class="wire" />
    <circle cx="250" cy="197" r="3.5" class="junction" />
    <line x1="250" y1="197" x2="236" y2="225" class="comp-sw" />
    <circle cx="250" cy="233" r="3.5" class="junction" />
    <line x1="250" y1="233" x2="250" y2="290" class="wire" />
    <text x="224" y="213" class="label-end">S</text>
    <text x="224" y="231" class="sublabel" text-anchor="end">PWM Switch</text>
    
<circle cx="250" cy="290" r="4" class="junction" />

    <line x1="250" y1="140" x2="319" y2="140" class="wire" />
    <line x1="319" y1="122" x2="319" y2="158" class="wire" stroke-width="3" />
    <line x1="331" y1="122" x2="331" y2="158" class="wire" stroke-width="3" />
    <line x1="331" y1="140" x2="400" y2="140" class="wire" />
    <text x="325" y="116" class="label">C_cp</text>
    <text x="325" y="172" class="sublabel">Coupling Cap</text>
    
<circle cx="400" cy="140" r="4" class="junction" />

    <line x1="400" y1="140" x2="400" y2="187" class="wire" />
    <path d="M 400 187 C 416 187, 416 201, 400 201
             C 416 201, 416 215, 400 215
             C 416 215, 416 229, 400 229
             C 416 229, 416 243, 400 243" class="wire" stroke-width="2.5" />
    <line x1="400" y1="243" x2="400" y2="290" class="wire" />
    <text x="378" y="212" class="label-end">L_2</text>
    <text x="378" y="230" class="sublabel" text-anchor="end">Second Inductor</text>
    
<circle cx="400" cy="290" r="4" class="junction" />

        <line x1="400" y1="140" x2="461" y2="140" class="wire" />
        <polygon points="461,126 489,140 461,154" class="comp-diode" />
        <line x1="489" y1="126" x2="489" y2="154" class="wire" stroke-width="2.5" stroke="#0284c7" />
        <line x1="489" y1="140" x2="550" y2="140" class="wire" />
        <text x="475" y="118" class="label">D</text>
        <text x="475" y="166" class="sublabel">Freewheel Diode</text>
        
<circle cx="550" cy="140" r="4" class="junction" />

    <line x1="550" y1="140" x2="550" y2="209" class="wire" />
    <line x1="532" y1="209" x2="568" y2="209" class="wire" stroke-width="3" />
    <line x1="532" y1="221" x2="568" y2="221" class="wire" stroke-width="3" />
    <line x1="550" y1="221" x2="550" y2="290" class="wire" />
    <text x="574" y="212" class="label-start">C_out</text>
    <text x="574" y="230" class="sublabel-start">Output Filter</text>
    
<circle cx="550" cy="290" r="4" class="junction" />
<line x1="550" y1="140" x2="670" y2="140" class="wire" />
<circle cx="670" cy="140" r="4" class="junction" />

    <line x1="670" y1="140" x2="670" y2="187" class="wire" />
    <rect x="658" y="187" width="24" height="56" class="comp-body" />
    <line x1="670" y1="243" x2="670" y2="290" class="wire" />
    <text x="690" y="212" class="label-start">R_L</text>
    <text x="690" y="230" class="sublabel-start">Load</text>
    
<circle cx="670" cy="290" r="4" class="junction" />
<line x1="670" y1="140" x2="740" y2="140" class="wire" />
<line x1="670" y1="290" x2="740" y2="290" class="wire" />

    <circle cx="740" cy="140" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <circle cx="740" cy="290" r="4" fill="none" stroke="#0284c7" stroke-width="2" />
    <text x="754" y="145" class="tag-pos">+</text>
    <text x="754" y="295" class="tag-neg">&#8722;</text>
    <line x1="765" y1="155" x2="765" y2="275" class="measure-arrow" marker-end="url(#arr-blue)" />
    <text x="782" y="220" class="label" fill="#0284c7">Vdc</text>
    
<line x1="120" y1="290" x2="670" y2="290" class="wire" />

    <line x1="325" y1="290" x2="325" y2="305" class="wire" />
    <line x1="307" y1="305" x2="343" y2="305" class="wire-gnd" />
    <line x1="314" y1="311" x2="336" y2="311" class="wire-gnd" />
    <line x1="321" y1="317" x2="329" y2="317" class="wire-gnd" />
    <text x="325" y="332" class="sublabel">GND</text>
    
</svg>