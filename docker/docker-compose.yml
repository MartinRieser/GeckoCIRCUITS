# GeckoCIRCUITS Docker Compose Configuration
# Local development and testing environment

services:
  # ==========================================================================
  # GeckoCIRCUITS REST API Service
  # ==========================================================================
  gecko-api:
    build:
      context: ../src/modules
      dockerfile: ../../docker/Dockerfile.api
    image: geckocircuits/rest-api:latest
    container_name: gecko-api
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx2G -XX:+UseContainerSupport -Djava.awt.headless=true
      - SERVER_PORT=8080
    volumes:
      # Mount example circuits (read-only)
      - ../resources/examples:/app/circuits:ro
      # Mount data directory for simulation results
      - gecko-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/gecko/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

volumes:
  gecko-data:
    driver: local

networks:
  default:
    name: gecko-network
