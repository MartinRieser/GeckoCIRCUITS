<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="auto">
  <defs>
    <style>
      .bg-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .wire { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-thin { stroke: #0284c7; stroke-width: 1.75; stroke-linecap: round; stroke-dasharray: 4,4; fill: none; }
      .component { stroke: #0284c7; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .diode-fill { fill: #0284c7; }
      .node-dot { fill: #1e293b; }
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .label-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; }
      .label-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #64748b; }
      .arrow-i { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .arrow-v { stroke: #2563eb; stroke-width: 1.75; fill: none; marker-end: url(#arrow-blue); }
      .source-plus { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; fill: #dc2626; text-anchor: middle; }
      .source-minus { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #475569; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg-card { fill: #0f172a; stroke: #334155; }
        .wire { stroke: #e2e8f0; }
        .wire-thin { stroke: #38bdf8; }
        .component { stroke: #38bdf8; }
        .diode-fill { fill: #38bdf8; }
        .node-dot { fill: #e2e8f0; }
        .label-title { fill: #f8fafc; }
        .label-sub { fill: #94a3b8; }
        .label-main { fill: #f1f5f9; }
        .label-desc { fill: #94a3b8; }
        .source-minus { fill: #94a3b8; }
      }
    </style>

    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect class="bg-card" x="4" y="4" width="852" height="372" />

  <!-- Header -->
  <text class="label-title" x="28" y="34">Buck Converter (Step-Down DC-DC)</text>
  <text class="label-sub" x="28" y="52">European IEC 60617 Standard Schematic &#8226; Continuous Conduction Mode (CCM)</text>

  <!-- ================= INPUT DC SOURCE Vin ================= -->
  <!-- Left Source Label -->
  <text class="label-main" x="72" y="205" text-anchor="end">V<tspan baseline-shift="sub" font-size="10">in</tspan></text>
  <text class="label-desc" x="72" y="221" text-anchor="end">DC Input</text>

  <!-- Source Circle -->
  <circle cx="115" cy="210" r="26" class="component" fill="#f0f9ff" />
  <text class="source-plus" x="115" y="202">+</text>
  <text class="source-minus" x="115" y="226">&#8722;</text>

  <!-- Source to Top Rail -->
  <path class="wire" d="M 115 184 L 115 125 L 210 125" />
  <!-- Source to GND Rail -->
  <path class="wire" d="M 115 236 L 115 300 L 325 300" />

  <!-- ================= CONTROLLED SWITCH S ================= -->
  <g transform="translate(210, 100)">
    <path class="wire" d="M 0 25 L 18 25" />
    <path class="wire" d="M 62 25 L 80 25" />
    <circle cx="18" cy="25" r="3" class="component" fill="#ffffff" />
    <circle cx="62" cy="25" r="3" class="component" fill="#ffffff" />
    <!-- Switch blade -->
    <path class="component" d="M 19 23 L 56 10" />
    <!-- Gate control wire -->
    <path class="wire-thin" d="M 38 17 L 38 -8" />
    <text class="label-desc" x="38" y="-14" text-anchor="middle" fill="#0284c7" font-weight="600">PWM Gate</text>
    <text class="label-main" x="40" y="45" text-anchor="middle">S</text>
    <text class="label-desc" x="40" y="58" text-anchor="middle">Power Switch</text>
  </g>

  <!-- Top rail between switch and SW node -->
  <path class="wire" d="M 290 125 L 405 125" />
  <!-- SW Node dot -->
  <circle cx="325" cy="125" r="4.5" class="node-dot" />
  <text class="label-desc" x="325" y="108" text-anchor="middle" font-weight="600">SW Node (V<tspan baseline-shift="sub" font-size="9">x</tspan>)</text>

  <!-- ================= FREEWHEELING DIODE D ================= -->
  <path class="wire" d="M 325 125 L 325 180" />
  <g transform="translate(325, 210)">
    <!-- Cathode horizontal bar -->
    <path class="component" d="M -16 -16 L 16 -16" />
    <path class="component" d="M -16 -16 L -16 -10" />
    <path class="component" d="M 16 -16 L 16 -22" />
    <!-- Anode triangle pointing UP -->
    <polygon points="0 -16, -16 14, 16 14" class="diode-fill" stroke="#0284c7" stroke-width="2" />
    <path class="wire" d="M 0 14 L 0 40" />
    <text class="label-main" x="24" y="3">D</text>
    <text class="label-desc" x="24" y="17">Freewheeling</text>
    <text class="label-desc" x="24" y="29">Diode</text>
  </g>
  <path class="wire" d="M 325 250 L 325 300" />
  <circle cx="325" cy="300" r="4.5" class="node-dot" />

  <!-- ================= OUTPUT INDUCTOR L ================= -->
  <g transform="translate(405, 125)">
    <!-- 4 Inductor arcs (coils) -->
    <path class="component" d="
      M 0 0 
      A 11 11 0 0 1 22 0 
      A 11 11 0 0 1 44 0 
      A 11 11 0 0 1 66 0 
      A 11 11 0 0 1 88 0
    " />
    <!-- Magnetic core bars -->
    <path class="component" stroke-width="1.5" d="M 2 -15 L 86 -15" />
    <path class="component" stroke-width="1.5" d="M 2 -18 L 86 -18" />
    <!-- Current arrow -->
    <path class="arrow-i" d="M 22 -28 L 66 -28" />
    <text class="label-main" x="44" y="-34" text-anchor="middle" fill="#16a34a">i<tspan baseline-shift="sub" font-size="10">L</tspan></text>
    <text class="label-main" x="44" y="25" text-anchor="middle">L</text>
    <text class="label-desc" x="44" y="38" text-anchor="middle">Output Inductor</text>
  </g>

  <!-- Top rail between Inductor and Output -->
  <path class="wire" d="M 493 125 L 575 125" />

  <!-- ================= FILTER CAPACITOR C ================= -->
  <circle cx="575" cy="125" r="4.5" class="node-dot" />
  <path class="wire" d="M 575 125 L 575 196" />
  <g transform="translate(575, 210)">
    <line x1="-18" y1="-10" x2="18" y2="-10" class="component" stroke-width="3" />
    <line x1="-18" y1="6" x2="18" y2="6" class="component" stroke-width="3" />
    <path class="wire" d="M 0 -20 L 0 -10" />
    <path class="wire" d="M 0 6 L 0 20" />
    <text class="label-main" x="24" y="-1">C</text>
    <text class="label-desc" x="24" y="13">Filter</text>
    <text class="label-desc" x="24" y="25">Capacitor</text>
  </g>
  <path class="wire" d="M 575 230 L 575 300" />
  <circle cx="575" cy="300" r="4.5" class="node-dot" />

  <!-- Rail to Load -->
  <path class="wire" d="M 575 125 L 690 125" />
  <path class="wire" d="M 575 300 L 690 300" />

  <!-- ================= LOAD RESISTOR RL ================= -->
  <circle cx="690" cy="125" r="4.5" class="node-dot" />
  <path class="wire" d="M 690 125 L 690 180" />
  <g transform="translate(690, 210)">
    <rect x="-12" y="-28" width="24" height="56" class="component" fill="#f8fafc" stroke-width="2.5" rx="2" />
    <path class="wire" d="M 0 -38 L 0 -28" />
    <path class="wire" d="M 0 28 L 0 38" />
    <text class="label-main" x="20" y="2">R<tspan baseline-shift="sub" font-size="10">L</tspan></text>
    <text class="label-desc" x="20" y="16">Load</text>
    <text class="label-desc" x="20" y="28">Resistor</text>
  </g>
  <path class="wire" d="M 690 248 L 690 300" />
  <circle cx="690" cy="300" r="4.5" class="node-dot" />

  <!-- ================= OUTPUT TERMINALS & Vout ================= -->
  <path class="wire" d="M 690 125 L 765 125" />
  <path class="wire" d="M 690 300 L 765 300" />
  <circle cx="765" cy="125" r="3.5" class="component" fill="#ffffff" />
  <circle cx="765" cy="300" r="3.5" class="component" fill="#ffffff" />
  <text class="source-plus" x="778" y="130">+</text>
  <text class="source-minus" x="778" y="305">&#8722;</text>
  <!-- Voltage arrow -->
  <path class="arrow-v" d="M 792 145 L 792 280" />
  <text class="label-main" x="804" y="206" fill="#2563eb">V<tspan baseline-shift="sub" font-size="10">out</tspan></text>
  <text class="label-desc" x="804" y="222">DC Output</text>

  <!-- ================= COMMON GROUND RAIL ================= -->
  <path class="wire" d="M 115 300 L 765 300" />
  <!-- IEC Ground Symbol -->
  <g transform="translate(220, 300)">
    <path class="wire" d="M 0 0 L 0 16" />
    <line x1="-16" y1="16" x2="16" y2="16" class="wire" stroke-width="2.5" />
    <line x1="-10" y1="21" x2="10" y2="21" class="wire" stroke-width="2" />
    <line x1="-4" y1="26" x2="4" y2="26" class="wire" stroke-width="1.5" />
    <text class="label-desc" x="0" y="42" text-anchor="middle">GND (0 V)</text>
  </g>
</svg>
