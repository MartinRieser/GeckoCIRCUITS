[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geckopy"
version = "1.0.0"
description = "Python SDK for GeckoCIRCUITS simulation engine and MNA circuit modeling"
authors = [{ name = "GeckoCIRCUITS" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=1.5.0", "numpy>=1.20.0"]

[tool.setuptools.packages.find]
include = ["geckopy*"]
